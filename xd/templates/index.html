<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Archivos</title>
</head>
<body>
    <h1>Subir un nuevo archivo</h1>
    
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="fichero">
        <button type="submit">Enviar archivo</button>
    </form>

    <h2>Lista de Archivos Disponibles</h2>
    <ul>
        {% for archivo in archivos %}
            <li>
                <a href="/archivos_cargados/{{ archivo }}" target="_blank">{{ archivo }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
